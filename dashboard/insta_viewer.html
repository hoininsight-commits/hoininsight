<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOIN Insight | Instagram Card News</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Outfit:wght@700&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --bg: #000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #111; color: #fff; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .phone-frame { width: 100%; max-width: 450px; aspect-ratio: 4 / 5; background: var(--bg); position: relative; overflow: hidden; border-radius: 20px; margin-top: 20px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
        .container { width: 100%; height: 100%; display: flex; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide { min-width: 100%; height: 100%; position: relative; padding: 60px 40px; display: flex; flex-direction: column; background-size: cover; background-position: center; }
        .slide::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%); z-index: 1; }
        .content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; }
        .page-num { position: absolute; top: 20px; right: 20px; font-family: 'Outfit'; font-size: 14px; color: rgba(255,255,255,0.5); z-index: 10; }
        .header { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; }
        .logo-box { width: 30px; height: 30px; background: var(--primary); border-radius: 5px; }
        .brand { font-family: 'Outfit'; font-weight: 700; font-size: 16px; }
        .title-main { font-family: 'Black Han Sans', sans-serif; font-size: 44px; line-height: 1.1; margin-bottom: 20px; word-break: keep-all; text-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .highlight-text { color: var(--primary); font-weight: 900; font-size: 24px; margin-bottom: 10px; }
        .fact-box { background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); border-left: 5px solid var(--primary); padding: 20px; margin: 20px 0; border-radius: 5px; }
        .body-text { font-size: 18px; line-height: 1.6; color: #ddd; word-break: keep-all; }
        .footer { margin-top: auto; display: flex; justify-content: space-between; font-size: 12px; color: #888; }
        .nav-btns { display: flex; gap: 20px; margin-top: 30px; }
        .nav-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px 25px; border-radius: 30px; cursor: pointer; }
        .nav-btn:hover { background: var(--primary); color: #000; }
    </style>
</head>
<body>
    <div class="phone-frame"><div class="container" id="slide-container"></div></div>
    <div class="nav-btns">
        <button class="nav-btn" onclick="prevSlide()">이전</button>
        <button class="nav-btn" onclick="nextSlide()">다음</button>
    </div>
    <script>
        let currentSlide = 0; let totalSlides = 0;
        
        // [v24.2] 지능형 환경 인지: GitHub Pages 표준 BASE_URL 시스템
        const BASE_URL = window.location.hostname.includes('github.io') ? '/hoininsight' : '..';

        function getBaseDataPath(path) {
            return BASE_URL + '/' + path + '/';
        }

        async function initInsta() {
            const params = new URLSearchParams(window.location.search);
            const path = params.get('path');
            if (!path) return;
            const basePath = getBaseDataPath(path);
            try {
                const response = await fetch(basePath + 'insta_cards.json');
                const data = await response.json();
                const slides = data.slides || [];
                totalSlides = slides.length;
                renderInsta(slides, basePath);
            } catch (err) { console.error(err); }
        }
        function renderInsta(slides, basePath) {
            const container = document.getElementById('slide-container');
            slides.forEach((slide, idx) => {
                const div = document.createElement('div'); div.className = 'slide';
                // [v23.4] 지능형 배경 선택: 전용 이미지가 없으면 기본 cover.png 사용
                const bg = 'cover.png'; 
                div.style.backgroundImage = "url('" + basePath + "assets/" + bg + "')";
                div.innerHTML = `
                    <div class="page-num">${idx + 1} / ${slides.length}</div>
                    <div class="content">
                        <div class="header"><div class="logo-box"></div><span class="brand">HOIN INSIGHT</span></div>
                        ${idx === 0 ? `<h1 class="title-main">${slide.title}</h1>` : `<div class="highlight-text">${slide.title}</div>`}
                        <div class="fact-box"><p class="body-text">${slide.content}</p></div>
                        <div class="footer"><span>경제의 맥을 짚는 사냥꾼</span><span>@hoin_insight</span></div>
                    </div>`;
                container.appendChild(div);
            });
        }
        function nextSlide() { if (currentSlide < totalSlides - 1) { currentSlide++; updatePos(); } }
        function prevSlide() { if (currentSlide > 0) { currentSlide--; updatePos(); } }
        function updatePos() { document.getElementById('slide-container').style.transform = 'translateX(-' + (currentSlide * 100) + '%)'; }
        window.onload = initInsta;
    </script>
</body>
</html>
