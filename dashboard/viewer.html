<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOIN Insight | Card News Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --accent: #ff007a;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 8px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
        }

        .back-btn:hover { background: rgba(255,255,255,0.2); }

        .container {
            width: 100%;
            height: 100%;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scrollbar-width: none;
        }

        .container::-webkit-scrollbar { display: none; }

        .card {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px 30px;
            background-size: cover;
            background-position: center;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 70%, rgba(0,0,0,1) 100%);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.8s ease-out;
            max-width: 500px;
            margin: 0 auto;
        }

        .label {
            display: inline-block;
            background: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        h1 { font-size: 28px; line-height: 1.3; margin-bottom: 20px; word-break: keep-all; }
        p { font-size: 16px; line-height: 1.6; color: #ccc; word-break: keep-all; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← 아카이브로</a>

    <div class="loading-overlay" id="loader">
        <p>대본과 이미지를 불러오는 중...</p>
    </div>

    <div class="container" id="card-container">
        <!-- Cards will be injected here -->
    </div>

    <script>
        async function initViewer() {
            const params = new URLSearchParams(window.location.search);
            const date = params.get('date');
            const title = params.get('title') || '오늘의 사냥';
            const img = params.get('img') || 'cover.png';
            
            if (!date) {
                alert('잘못된 접근입니다.');
                window.location.href = 'index.html';
                return;
            }

            // 경로 구성: data/scripts/YYYY/MM/DD/Round_3/
            const y = date.substring(0, 4);
            const m = date.substring(4, 6);
            const d = date.substring(6, 8);
            const basePath = `../data/scripts/${y}/${m}/${d}/Round_3/`;
            
            try {
                // 1. 대본 로드
                const scriptResp = await fetch(basePath + 'today_script_short.md');
                if (!scriptResp.ok) throw new Error('Script not found');
                const scriptText = await scriptResp.text();
                
                // 2. 대본 파싱 (구간별 분리)
                const sections = parseScript(scriptText);
                
                // 3. 카드 생성
                renderCards(sections, basePath, title, img);
                
                document.getElementById('loader').style.display = 'none';
            } catch (error) {
                console.error(error);
                document.getElementById('loader').innerHTML = '<p>데이터를 불러오지 못했습니다. (파일 부재 혹은 보안 이슈)</p>';
            }
        }

        function parseScript(text) {
            // [00-05초], [05-45초] 등의 패턴으로 분리
            const sections = [];
            const regex = /\[(\d{2}-\d{2}초)\]/g;
            const matches = [...text.matchAll(regex)];
            
            for (let i = 0; i < matches.length; i++) {
                const start = matches[i].index;
                const end = matches[i+1] ? matches[i+1].index : text.length;
                const content = text.substring(start, end);
                
                // 나레이션 파트 추출
                const narrationMatch = content.match(/나레이션:\s*([\s\S]*)/i);
                const narration = narrationMatch ? narrationMatch[1].trim() : "";
                
                sections.push({
                    time: matches[i][1],
                    narration: narration
                });
            }
            return sections;
        }

        function renderCards(sections, basePath, title, img) {
            const container = document.getElementById('card-container');
            
            // 명시된 이미지 사용
            const coverImg = img || 'cover.png';
            const analysisImg = img || 'analysis.png'; // 보안은 전용 이미지 위주로

            // Cover Card
            const cover = document.createElement('div');
            cover.className = 'card';
            cover.style.backgroundImage = `url('${basePath}assets/${coverImg}'), url('assets/cover.png')`;
            cover.innerHTML = `
                <div class="content">
                    <div class="label">HOIN INSIGHT | COVER</div>
                    <h1>${title}</h1>
                    <p>전략적 사냥 결과 보고서. 위로 올려서 상세 내용을 확인하세요.</p>
                </div>
            `;
            container.appendChild(cover);

            // Section Cards
            sections.forEach((sec, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                // 배경 선택
                const bg = idx % 2 === 0 ? analysisImg : coverImg;
                card.style.backgroundImage = `url('${basePath}assets/${bg}'), url('assets/${bg}')`;
                
                card.innerHTML = `
                    <div class="content">
                        <div class="label">SECTION ${idx + 1} | ${sec.time}</div>
                        <p style="font-size: 20px; color: #fff; line-height: 1.5;">${sec.narration}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = initViewer;
    </script>
</body>
</html>
