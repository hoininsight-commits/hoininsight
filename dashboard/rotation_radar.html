<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOIN Insight - 사냥꾼의 순환매 레이더 v5.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --card-bg: rgba(20, 20, 20, 0.7);
            --accent-cyan: #00f2ff;
            --accent-magenta: #ff007a;
            --accent-green: #00ff88;
            --text-main: #ffffff;
            --text-dim: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            font-family: 'Noto Sans KR', sans-serif;
            overflow-x: hidden;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 242, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(255, 0, 122, 0.05) 0%, transparent 50%);
        }

        .header {
            max-width: 1800px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 10px;
        }

        .title-area h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            letter-spacing: 5px;
            background: linear-gradient(90deg, var(--accent-cyan), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .breadth-status-board {
            display: flex;
            gap: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px 25px;
            border-radius: 20px;
        }

        .stat-item { text-align: center; }
        .stat-label { font-size: 0.6rem; color: var(--text-dim); margin-bottom: 5px; font-family: 'Orbitron'; }
        .stat-value { font-family: 'Orbitron'; font-size: 1.4rem; font-weight: 900; }
        .stat-value.up { color: var(--accent-green); }
        .stat-value.down { color: var(--accent-magenta); }

        .streak-tracker { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        .streak-dot { width: 10px; height: 10px; border-radius: 50%; background: #222; border: 1px solid rgba(255,255,255,0.1); }
        .streak-dot.active { background: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-cyan); }

        /* --- Waterflow Heatmap --- */
        .timeline-section {
            max-width: 1800px;
            margin: 0 auto 40px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 25px;
            letter-spacing: 3px;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .heatmap-container {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 20px;
        }

        .heatmap-labels { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
        .heatmap-label { font-size: 0.7rem; color: var(--text-dim); text-align: right; padding-right: 15px; font-family: 'Orbitron'; height: 35px; display: flex; align-items: center; justify-content: flex-end; }

        .heatmap-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .heatmap-row {
            display: flex;
            gap: 5px;
        }

        .heatmap-cell {
            flex: 1;
            height: 35px;
            border-radius: 6px;
            background: #111;
            position: relative;
            transition: all 0.3s;
        }
        .heatmap-cell:hover { transform: scale(1.1); z-index: 10; cursor: crosshair; }
        .heatmap-cell .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #000;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 900;
            display: none;
            white-space: nowrap;
            z-index: 100;
        }
        .heatmap-cell:hover .tooltip { display: block; }

        .date-labels {
            grid-column: 2;
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        .date-label { flex: 1; text-align: center; font-size: 0.6rem; color: #444; font-family: 'Orbitron'; }

        /* --- Radar Grid --- */
        .radar-grid {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            max-width: 1800px;
            margin: 0 auto;
        }

        .stage-card {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 24px;
            padding: 25px;
            min-height: 500px;
            position: relative;
            transition: all 0.5s;
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
        }

        .stage-card.active { border-color: var(--theme-color); box-shadow: 0 0 40px rgba(var(--theme-rgb), 0.1); }
        .stage-card:not(.active) { opacity: 0.2; filter: grayscale(1); }

        .stage-header { margin-bottom: 20px; }
        .stage-label { font-family: 'Orbitron'; color: var(--theme-color); font-size: 0.7rem; font-weight: 700; margin-bottom: 5px; display: block; }
        .stage-name { font-size: 1.2rem; font-weight: 900; margin-bottom: 5px; }
        .stage-desc { font-size: 0.75rem; color: var(--text-dim); line-height: 1.4; }

        .basis-box {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.75rem;
            color: #ccc;
            margin-bottom: 20px;
            border-left: 3px solid var(--theme-color);
        }

        .signal-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .signal-item:hover { transform: translateX(5px); background: rgba(255,255,255,0.08); border-color: var(--theme-color); }
        .signal-item .comp { font-weight: 800; color: #fff; font-size: 0.85rem; display: block; }
        .signal-item .tit { color: var(--text-dim); font-size: 0.7rem; }

        .market-msg { font-family: 'Orbitron'; font-size: 0.8rem; color: var(--accent-cyan); margin-top: 10px; text-shadow: 0 0 10px var(--accent-cyan); }
        .current-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--theme-color);
            color: #000;
            font-family: 'Orbitron';
            font-size: 0.6rem;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 4px;
            box-shadow: 0 0 15px var(--theme-color);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }
        .last-updated { text-align: center; margin-top: 50px; color: #333; font-size: 0.7rem; font-family: 'Orbitron'; }

        /* Energy Gauge CSS */
        .gauge-container {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            margin: 15px 0;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .gauge-bar {
            height: 100%;
            border-radius: 6px;
            transition: width 0.8s ease-out;
            box-shadow: 0 0 10px var(--theme-color);
        }
        .peak-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #fff;
            box-shadow: 0 0 8px #fff;
            z-index: 2;
        }
        .gauge-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-dim);
            font-family: 'Orbitron';
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-area">
            <h1>ROTATION RADAR <span style="font-size: 0.8rem; color: #333;">v5.5</span></h1>
            <div id="market-msg" class="market-msg">ANALYZING WATERFLOW...</div>
        </div>

        <div class="breadth-status-board">
            <div class="stat-item">
                <div class="stat-label">ADVANCING</div>
                <div id="stat-adv" class="stat-value up">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">DECLINING</div>
                <div id="stat-dec" class="stat-value down">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">RATIO</div>
                <div id="stat-ratio" class="stat-value">0.00</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">3-DAY STREAK</div>
                <div class="streak-tracker">
                    <div id="streak-1" class="streak-dot"></div>
                    <div id="streak-2" class="streak-dot"></div>
                    <div id="streak-3" class="streak-dot"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Timeline Section -->
    <div class="timeline-section">
        <div class="section-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            WATERFLOW TIMELINE (15D ENERGY)
        </div>
        <div class="heatmap-container">
            <div id="heatmap-labels" class="heatmap-labels">
                <!-- JS Inject -->
            </div>
            <div class="heatmap-grid-area">
                <div id="heatmap-grid" class="heatmap-grid">
                    <!-- JS Inject -->
                </div>
                <div id="date-labels" class="date-labels">
                    <!-- JS Inject -->
                </div>
            </div>
        </div>
    </div>

    <div id="radar-grid" class="radar-grid">
        <!-- JS Inject -->
    </div>

    <div class="last-updated">SYSTEM STATUS: NOMINAL | LAST SYNC: <span id="update-time">-</span></div>

    <script>
        const hexToRgb = (hex) => {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `${r}, ${g}, ${b}`;
        };

        async function updateRadar() {
            try {
                const response = await fetch('../data/monitoring/rotation_radar.json?t=' + new Date().getTime());
                const data = await response.json();
                
                // Breadth Update
                const b = data.breadth;
                document.getElementById('stat-adv').innerText = b.today_adv;
                document.getElementById('stat-dec').innerText = b.today_dec;
                document.getElementById('stat-ratio').innerText = b.today_ratio.toFixed(2);
                document.getElementById('market-msg').innerText = `CURRENT FOCUS: ${data.current_stage_name.toUpperCase()}`;
                document.getElementById('update-time').innerText = data.last_updated;

                for(let i=1; i<=3; i++) {
                    const dot = document.getElementById(`streak-${i}`);
                    if (i <= b.streak_days) dot.classList.add('active');
                    else dot.classList.remove('active');
                }

                // Heatmap Render
                const heatmapLabels = document.getElementById('heatmap-labels');
                const heatmapGrid = document.getElementById('heatmap-grid');
                const dateLabels = document.getElementById('date-labels');
                
                heatmapLabels.innerHTML = '';
                heatmapGrid.innerHTML = '';
                dateLabels.innerHTML = '';

                const stageIds = Object.keys(data.stages);
                const timeline = data.flow_timeline;

                stageIds.forEach(sid => {
                    const label = document.createElement('div');
                    label.className = 'heatmap-label';
                    label.innerText = data.stages[sid].name.split(' ')[0]; // 첫 단어만
                    heatmapLabels.appendChild(label);

                    const row = document.createElement('div');
                    row.className = 'heatmap-row';
                    
                    timeline.forEach(day => {
                        const cell = document.createElement('div');
                        cell.className = 'heatmap-cell';
                        const val = day.values[sid] || 0;
                        
                        // Color Intensity Logic
                        const baseColor = data.stages[sid].color;
                        const opacity = Math.min(Math.max(val / 5, 0.05), 1); // 5% 등락률 기준 최대 밝기
                        cell.style.background = val > 0 
                            ? `rgba(${hexToRgb(baseColor)}, ${opacity})`
                            : '#111';
                        if (val > 2) cell.style.boxShadow = `0 0 15px rgba(${hexToRgb(baseColor)}, 0.5)`;

                        cell.innerHTML = `<div class="tooltip">${day.date}: ${val.toFixed(1)}%</div>`;
                        row.appendChild(cell);
                    });
                    heatmapGrid.appendChild(row);
                });

                timeline.forEach(day => {
                    const dLabel = document.createElement('div');
                    dLabel.className = 'date-label';
                    dLabel.innerText = day.date;
                    dateLabels.appendChild(dLabel);
                });

                // Radar Cards
                const grid = document.getElementById('radar-grid');
                grid.innerHTML = '';

                Object.entries(data.stages).forEach(([id, info], index) => {
                    const card = document.createElement('div');
                    card.className = `stage-card ${info.active ? 'active' : ''}`;
                    card.style.setProperty('--theme-color', info.color);
                    card.style.setProperty('--theme-rgb', hexToRgb(info.color));

                    let trackingHtml = info.tracking_stocks.length > 0
                        ? `<div class="tracking-list" style="margin-bottom: 20px;">
                            ${info.tracking_stocks.map(s => `
                                <div style="display: flex; justify-content: space-between; font-size: 0.75rem; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
                                    <span style="color: #fff; font-weight: 500;">${s.name}</span>
                                    <span style="color: ${s.change > 0 ? 'var(--accent-green)' : s.change < 0 ? 'var(--accent-magenta)' : '#888'}; font-weight: 800;">
                                        ${s.change > 0 ? '+' : ''}${s.change.toFixed(2)}%
                                    </span>
                                </div>
                            `).join('')}
                          </div>`
                        : '';

                    let signalsHtml = info.signals.length > 0 
                        ? `<div style="font-size: 0.6rem; color: var(--text-dim); margin-bottom: 8px; font-family: Orbitron;">RECENT SIGNALS</div>` + info.signals.slice(0, 2).map(s => `
                            <div class="signal-item" onclick="window.open('${s.link}', '_blank')">
                                <span class="comp">${s.company}</span>
                                <span class="tit">${s.title.substring(0, 30)}...</span>
                            </div>
                        `).join('')
                        : '';

                    let trendIcon = '';
                    if (info.trend === 'PEAK') trendIcon = '👑';
                    else if (info.trend === 'RISING') trendIcon = '↑';
                    else if (info.trend === 'FALLING') trendIcon = '↓';

                    // Gauge Calculation (0-5% range for visual)
                    const avgChange = info.tracking_stocks.length > 0 
                        ? info.tracking_stocks.reduce((acc, s) => acc + s.change, 0) / info.tracking_stocks.length 
                        : 0;
                    const gaugeWidth = Math.min(Math.max((avgChange / 5) * 100, 5), 100);
                    
                    // Mock Peak (usually would come from data, simplified here)
                    const peakPos = 85; 

                    card.innerHTML = `
                        ${info.is_current ? '<div class="current-badge">CURRENT</div>' : ''}
                        <div class="stage-header">
                            <span class="stage-label">STAGE 0${index + 1}</span>
                            <div class="stage-name">${info.name} ${trendIcon}</div>
                            <div class="stage-desc">${info.desc}</div>
                        </div>
                        
                        <div class="gauge-wrapper">
                            <div class="gauge-label">
                                <span>ENERGY HEAT</span>
                                <span>${avgChange.toFixed(2)}%</span>
                            </div>
                            <div class="gauge-container">
                                <div class="gauge-bar" style="width: ${gaugeWidth}%; background: ${info.color};"></div>
                                <div class="peak-marker" style="left: ${peakPos}%;"></div>
                            </div>
                        </div>

                        <div class="basis-box">${info.basis}</div>
                        ${trackingHtml}
                        <div class="signal-list">${signalsHtml}</div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }

        updateRadar();
        setInterval(updateRadar, 30000);
    </script>
</body>
</html>
