<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOIN Insight | Hunting Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --accent: #ff007a;
            --bg: #0a0a0c;
            --card-bg: #16161a;
            --glass: rgba(255, 255, 255, 0.05);
            --nav-bg: rgba(22, 22, 26, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            padding: 40px 20px;
            line-height: 1.6;
        }

        header {
            max-width: 1000px;
            margin: 0 auto 50px;
            text-align: center;
        }

        header h1 {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: #888;
            font-size: 18px;
        }

        nav {
            max-width: 1000px;
            margin: -20px auto 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .nav-link {
            text-decoration: none;
            color: #888;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 20px;
            border-radius: 30px;
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            border-color: var(--primary);
            background: rgba(0, 242, 255, 0.1);
        }

        .archive-grid {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .topic-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            text-decoration: none;
            color: inherit;
        }

        .topic-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0, 242, 255, 0.1);
        }

        .thumb {
            width: 100%;
            height: 180px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .thumb::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, var(--card-bg), transparent);
        }

        .card-info {
            padding: 20px;
        }

        .date-badge {
            font-size: 12px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
            letter-spacing: 1px;
        }

        .card-info h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.4;
            word-break: keep-all;
        }

        .status-pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            background: rgba(0, 242, 255, 0.1);
            color: var(--primary);
            border: 1px solid rgba(0, 242, 255, 0.2);
        }

        /* Loading State */
        #loading {
            text-align: center;
            padding: 50px;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <h1>HOIN HUNTING ARCHIVE</h1>
        <p>시장의 맥락을 사냥하고 기록한 전리품들</p>
    </header>

    <nav>
        <a href="index.html" class="nav-link active">Archive</a>
        <a href="rotation_radar.html" class="nav-link">Rotation Radar</a>
    </nav>

    <div id="loading">사냥 기록을 불러오는 중...</div>
    <div class="archive-grid" id="archive-grid"></div>

    <script>
        // [v24.2] 지능형 환경 인지: GitHub Pages 표준 BASE_URL 시스템
        const BASE_URL = window.location.hostname.includes('github.io') ? '/hoininsight' : '..';

        function getDataPath() {
            return BASE_URL + '/data/history/content_log.json';
        }

        function getBaseDataPath(path) {
            return BASE_URL + '/' + path + '/';
        }

        async function loadArchive() {
            try {
                const response = await fetch(getDataPath());
                const data = await response.json();
                const grid = document.getElementById('archive-grid');
                const loading = document.getElementById('loading');
                
                loading.style.display = 'none';
                
                // 최신순 정렬
                const items = data.contents.reverse();
                
                items.forEach(item => {
                    const card = document.createElement('a');
                    card.className = 'topic-card';
                    // insta_viewer.html로 연결 (path 파라미터 전달)
                    card.href = `insta_viewer.html?path=${encodeURIComponent(item.path)}&title=${encodeURIComponent(item.title)}`;
                    
                    // [v22.2] 주제별 격리 폴더 내부의 assets/cover.png를 직접 사용
                    const thumbUrl = `../${item.path}/assets/cover.png`;
                    
                    card.innerHTML = `
                        <div class="thumb" style="background-image: url('${thumbUrl}');"></div>
                        <div class="card-info">
                            <span class="date-badge">${item.date}</span>
                            <h2>${item.title}</h2>
                            <div class="status-pill">CARD NEWS READY</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Failed to load archive:', error);
                document.getElementById('loading').innerText = '기록을 불러오지 못했습니다. (데이터 파일 확인 필요)';
            }
        }

        window.onload = loadArchive;
    </script>
</body>
</html>
