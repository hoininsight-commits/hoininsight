<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOIN INSIGHT | Content Pack Center</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c14;
  --bg2: #0d1420;
  --bg3: #111827;
  --amber: #f0b429;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a855f7;
  --text: #e8edf5;
  --text-dim: #6b7a94;
  --border: #ffffff0a;
  --border2: #ffffff18;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'Noto Sans KR', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.6; }

/* ── CONTENT PACK HERO ── */
.pack-hero {
  padding: 80px 20px;
  background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 100%);
  text-align: center;
  border-bottom: 2px solid var(--border2);
}
.hero-title { font-size: 14px; font-family: var(--mono); color: var(--amber); letter-spacing: 5px; margin-bottom: 20px; }
.pack-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }

.content-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 30px;
  text-align: left;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.content-card:hover { transform: translateY(-10px); border-color: #ffffff44; background: rgba(255,255,255,0.05); }
.content-card.active { border-color: var(--amber); box-shadow: 0 0 30px rgba(240, 180, 41, 0.2); background: rgba(240, 180, 41, 0.05); }

.tier-label { font-family: var(--mono); font-weight: 700; font-size: 11px; padding: 4px 12px; border-radius: 50px; display: inline-block; margin-bottom: 15px; }
.label-TIER_1 { background: var(--green); color: #000; }
.label-TIER_2 { background: var(--amber); color: #000; }
.label-TIER_3 { background: var(--purple); color: #fff; }

.card-topic { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 12px; height: 3em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card-why-now { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

/* ── VIEWPORT ── */
.container { max-width: 1000px; margin: 0 auto; padding: 60px 20px; }
.layer-title { font-family: var(--mono); font-size: 13px; color: var(--text-dim); letter-spacing: 3px; margin-bottom: 25px; text-transform: uppercase; border-left: 3px solid var(--amber); padding-left: 15px; }

/* ── SCRIPT AREA ── */
.script-box {
  background: #000;
  border-radius: 20px;
  border: 1px solid var(--border2);
  overflow: hidden;
  margin-bottom: 60px;
}
.script-header { background: var(--bg2); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.script-content { padding: 40px; font-family: var(--mono); font-size: 15px; line-height: 1.8; color: #cbd5e1; white-space: pre-wrap; }

/* ── METRICS ── */
.metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 60px; }
.metric-card { background: var(--bg2); padding: 25px; border-radius: 16px; border: 1px solid var(--border); text-align: center; }
.metric-val { font-size: 32px; font-weight: 900; color: #fff; margin-bottom: 5px; }
.metric-label { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }

.fold-btn { background: var(--bg2); border: 1px solid var(--border2); color: var(--text-dim); padding: 12px 30px; border-radius: 50px; cursor: pointer; font-family: var(--mono); font-size: 12px; margin: 40px auto; display: block; }

/* MARKET BAR */
.market-bar { background: #000; padding: 10px 20px; border-bottom: 1px solid var(--border2); display: flex; justify-content: center; gap: 30px; font-family: var(--mono); font-size: 12px; }
.m-item { color: var(--text-dim); }
.m-item b { color: #fff; margin-left: 5px; }
</style>
</head>
<body>

<div class="market-bar" id="market-bar">
  <span class="m-item">금리: <b id="rate-v">--</b></span>
  <span class="m-item">S&P500: <b id="spx-v">--</b></span>
  <span class="m-item">BTC: <b id="btc-v">--</b></span>
</div>

<div class="pack-hero">
  <div class="hero-title">🔥 TODAY'S CONTENT PACK</div>
  <div class="pack-grid" id="pack-grid">
    <!-- Content Cards -->
  </div>
</div>

<div class="container" id="content-view">
  <div class="layer-title">▶ 원고 큐레이션 (Script Preview)</div>
  <div class="script-box">
    <div class="script-header">
      <div id="script-tier" style="font-family: var(--mono); font-weight: 700; color: var(--amber);">[SELECTED]</div>
      <button class="fold-btn" style="margin:0; padding: 5px 15px; font-size: 10px;" onclick="copyScript()">COPY BRL</button>
    </div>
    <div class="script-content" id="script-text">카드를 선택하여 원고를 확인하세요.</div>
  </div>

  <div class="layer-title">▶ 품질 및 신뢰도 (Decision Metrics)</div>
  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-val" id="m-quality">--</div>
      <div class="metric-label">Quality Score</div>
    </div>
    <div class="metric-card">
      <div class="metric-val" id="m-reality">--</div>
      <div class="metric-label">Reality Score</div>
    </div>
    <div class="metric-card">
      <div class="metric-val" id="m-trust">--</div>
      <div class="metric-label">Trust Strength</div>
    </div>
  </div>
</div>

<script>
let currentPack = {};

async function loadPack() {
  try {
    fetch('today_data.json')
      .then(r => r.json())
      .then(data => {
        currentPack = data.content_pack || {};
        const snap = data.market_snapshot || {};
        
        // 지표 바인딩
        document.getElementById('rate-v').textContent = snap.rates || '--';
        document.getElementById('spx-v').textContent = snap.spx || '--';
        document.getElementById('btc-v').textContent = snap.btc || '--';
        
        renderPack();
      });
  } catch(e) { console.error(e); }
}

function renderPack() {
  const grid = document.getElementById('pack-grid');
  grid.innerHTML = '';
  
  const tiers = ['TIER_1', 'TIER_2', 'TIER_3'];
  const typeMap = { 'TIER_1': 'MAIN', 'TIER_2': 'SECONDARY', 'TIER_3': 'EARLY SIGNAL' };
  
  let firstFound = null;
  
  tiers.forEach(t => {
    (currentPack[t] || []).forEach((c, idx) => {
      const card = document.createElement('div');
      card.className = 'content-card';
      if(!firstFound) { card.classList.add('active'); firstFound = c; }
      
      card.onclick = () => {
        document.querySelectorAll('.content-card').forEach(x => x.classList.remove('active'));
        card.classList.add('active');
        showContent(c);
      };
      
      card.innerHTML = `
        <div class="tier-label label-${t}">${typeMap[t]} (${t})</div>
        <div class="card-topic">${c.topic}</div>
        <div class="card-why-now">${c.why_now.substring(0, 80)}...</div>
      `;
      grid.appendChild(card);
    });
  });
  
  if(firstFound) showContent(firstFound);
}

function showContent(c) {
  document.getElementById('script-text').textContent = c.script;
  document.getElementById('script-tier').textContent = `[${c.content_tier}] | ${c.final_action}`;
  document.getElementById('m-quality').textContent = c.quality_score;
  document.getElementById('m-reality').textContent = c.reality_score + "/5";
  document.getElementById('m-trust').textContent = c.score_trust;
}

function copyScript() {
  const text = document.getElementById('script-text').textContent;
  navigator.clipboard.writeText(text);
  alert('원고가 복사되었습니다.');
}

loadPack();
</script>
</body>
</html>
