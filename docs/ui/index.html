<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOIN Insight | 운영 대시보드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        #app {
            display: grid;
            grid-template-areas: 
                "header header header"
                "sidebar-l main sidebar-r";
            grid-template-columns: 280px 1fr 280px;
            grid-template-rows: auto 1fr;
            min-height: 100vh;
            gap: 1.5rem;
            padding: 1.5rem;
        }

        /* Header */
        header {
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            padding: 1.25rem 2rem;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }
        .logo-group { display: flex; align-items: center; gap: 0.75rem; }
        .logo-text { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; color: var(--accent-blue); }
        .status-badge { 
            padding: 0.5rem 1rem; border-radius: 2rem; font-weight: 600; font-size: 0.875rem; 
            background: rgba(16, 185, 129, 0.1); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .last-sync { font-size: 0.75rem; color: var(--text-secondary); }

        /* Main View */
        main {
            grid-area: main;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 1.25rem;
            border: 1px solid var(--border-color);
            padding: 2rem;
            box-shadow: var(--shadow-md);
        }

        /* 오늘의 주제 */
        .hero-section {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-left: 4px solid var(--accent-blue);
        }
        .topic-label { color: var(--accent-blue); font-weight: 600; font-size: 0.875rem; margin-bottom: 0.5rem; display: block; }
        #topic-title { font-size: 2.25rem; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 1rem; }
        #why-now-text { font-size: 1.125rem; color: var(--text-secondary); line-height: 1.8; }

        /* 액션 메트릭 */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
        }
        .metric-card {
            background: rgba(15, 23, 42, 0.5);
            padding: 1.5rem;
            border-radius: 1rem;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .metric-label { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.5rem; display: block; font-weight: 600; }
        .metric-val { font-size: 1.5rem; font-weight: 800; }
        .action-add { color: var(--accent-green); }
        .action-hold { color: var(--text-secondary); }
        .action-reduce { color: var(--accent-red); }

        /* TOP 3 종목 */
        .stocks-section h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .stocks-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .stock-card {
            background: rgba(30, 41, 59, 0.5);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 1.25rem;
            transition: transform 0.2s;
        }
        .stock-card:hover { transform: translateY(-4px); border-color: var(--accent-blue); }
        .stock-rank { font-size: 2rem; font-weight: 800; color: var(--border-color); }
        .stock-name { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
        .stock-reason { font-size: 0.875rem; color: var(--text-secondary); line-height: 1.5; }

        /* Sidebars */
        .sidebar {
            background: rgba(30, 41, 59, 0.4);
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .sidebar-title { font-weight: 700; font-size: 1rem; margin-bottom: 1rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
        
        .history-list { list-style: none; }
        .history-list li { 
            padding: 0.75rem 0; border-bottom: 1px solid var(--border-color); font-size: 0.8125rem; 
            display: grid; grid-template-columns: 80px 1fr 40px; gap: 0.5rem;
        }
        .history-list .date { color: var(--text-secondary); }
        .history-list .res { font-weight: 700; text-align: right; }

        .active-topic-item {
            background: rgba(15, 23, 42, 0.3);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            border: 1px solid var(--border-color);
            margin-bottom: 0.5rem;
        }

        @media (max-width: 1200px) {
            #app { grid-template-areas: "header" "main" "sidebar-l" "sidebar-r"; grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div class="logo-group">
                <span class="logo-text">HOIN INSIGHT</span>
                <div id="global-status-badge" class="status-badge">운영 분석 중...</div>
            </div>
            <div class="header-right">
                <div id="last-sync" class="last-sync">마지막 갱신: 로딩 중...</div>
            </div>
        </header>

        <aside class="sidebar" style="grid-area: sidebar-l">
            <h3 class="sidebar-title">최근 7일 히스토리</h3>
            <ul id="history-list" class="history-list">
                <!-- Data injected here -->
            </ul>
        </aside>

        <main>
            <section class="card hero-section">
                <span class="topic-label">오늘의 핵심 주제</span>
                <h1 id="topic-title">데이터를 불러오는 중...</h1>
                <p id="why-now-text">연결된 SSOT 데이터가 업데이트될 때까지 기다려 주세요.</p>
            </section>

            <section class="card metrics-section">
                <div class="metrics-grid">
                    <div class="metric-card">
                        <span class="metric-label">ACTION</span>
                        <div id="action-val" class="metric-val">-</div>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">TIMING</span>
                        <div id="timing-val" class="metric-val">-</div>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">CONFIDENCE</span>
                        <div id="confidence-val" class="metric-val">-</div>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">RISK</span>
                        <div id="risk-val" class="metric-val">-</div>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">ALLOCATION</span>
                        <div id="allocation-val" class="metric-val">-</div>
                    </div>
                </div>
            </section>

            <section class="card stocks-section">
                <h2>🎯 핵심 종목 Top 3</h2>
                <div id="stocks-list" class="stocks-grid">
                    <!-- Data injected here -->
                </div>
            </section>
        </main>

        <aside class="sidebar" style="grid-area: sidebar-r">
            <h3 class="sidebar-title">현재 활성 이슈</h3>
            <div id="active-topics-list">
                <!-- Data injected here -->
            </div>
        </aside>
    </div>

    <script src="operator_simple.js"></script>
</body>
</html>
