<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOIN Insight | Operator Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="operator_today.js"></script>
  <script src="operator_history.js"></script>
  <script src="operator_radar.js"></script>
</head>
<body>

<aside class="sidebar">
  <div class="logo">HOIN Insight</div>
  
  <button id="btnToday" class="nav-btn active" onclick="switchTab('today')">📌 오늘 포착 주제</button>
  <button id="btnHistory" class="nav-btn" onclick="switchTab('history')">📊 과거 포착 리스트</button>
  <button id="btnRadar" class="nav-btn" onclick="switchTab('radar')">📡 현재 이슈 흐름</button>
  
  <div style="margin-top: auto; font-size: 11px; color: var(--text-secondary); opacity: 0.6;">
    V3.5.0 STABLE • SSOT READ ONLY
  </div>
</aside>

<main id="content" class="main-content">
  <!-- Content will be rendered here -->
</main>

<script>
  function switchTab(tab) {
    // UI Update
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    
    if (tab === 'today') {
      document.getElementById('btnToday').classList.add('active');
      renderToday();
    } else if (tab === 'history') {
      document.getElementById('btnHistory').classList.add('active');
      renderHistory();
    } else if (tab === 'radar') {
      document.getElementById('btnRadar').classList.add('active');
      renderRadar();
    }
  }

  // Initial Render
  window.onload = () => renderToday();
</script>

</body>
</html>
