<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOIN 운영자 대시보드</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --blue: #58a6ff;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 600; }
  .grade-badge { background: var(--purple); color: #000; padding: 2px 10px; border-radius: 12px; font-weight: 700; font-size: 13px; }
  .score-text { color: var(--muted); font-size: 13px; }
  .refresh-btn { margin-left: auto; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .refresh-btn:hover { background: var(--border); }

  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 20px; gap: 0; }
  .tab { padding: 10px 18px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-size: 13px; }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }
  .tab:hover:not(.active) { color: var(--text); }

  .content { padding: 20px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card-title { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .card-value { font-size: 22px; font-weight: 600; }
  .card-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .check-list { display: flex; flex-direction: column; gap: 8px; }
  .check-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--bg); border-radius: 6px; }
  .check-item .icon { font-size: 15px; flex-shrink: 0; }
  .check-item .name { flex: 1; }
  .check-item .detail { color: var(--muted); font-size: 12px; }

  .agent-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .agent-row:last-child { border-bottom: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: var(--green); }
  .dot.fail { background: var(--red); }
  .dot.wait { background: var(--yellow); }
  .agent-name { flex: 1; }
  .agent-status { font-size: 12px; color: var(--muted); }

  .signal-topic { font-size: 18px; font-weight: 600; line-height: 1.4; margin-bottom: 12px; }
  .signal-meta { display: flex; gap: 16px; flex-wrap: wrap; }
  .meta-item { display: flex; flex-direction: column; gap: 2px; }
  .meta-label { color: var(--muted); font-size: 11px; }
  .meta-val { font-weight: 600; }

  .strength-bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .strength-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--yellow), var(--green)); transition: width 0.6s ease; }

  .history-table { width: 100%; border-collapse: collapse; }
  .history-table th { color: var(--muted); font-size: 11px; text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .history-table td { padding: 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .history-table tr:last-child td { border-bottom: none; }
  .type-badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .type-롱폼 { background: #1f3a5f; color: var(--blue); }
  .type-쇼츠 { background: #2d1f3a; color: var(--purple); }

  .error-msg { color: var(--red); padding: 20px; text-align: center; }
  .loading { color: var(--muted); padding: 20px; text-align: center; }

  .date-label { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>HOIN 운영자 대시보드</h1>
  <span class="grade-badge" id="grade">-</span>
  <span class="score-text" id="score-text">로딩 중...</span>
  <button class="refresh-btn" onclick="loadAll()">새로고침</button>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('system', this)">시스템</div>
  <div class="tab" onclick="switchTab('market', this)">시장</div>
  <div class="tab" onclick="switchTab('signal', this)">신호</div>
  <div class="tab" onclick="switchTab('history', this)">이력</div>
</div>

<div class="content">

  <!-- 시스템 탭 -->
  <div class="panel active" id="panel-system">
    <div class="grid2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-title">에이전트 상태</div>
        <div id="agents-list"><div class="loading">로딩 중...</div></div>
      </div>
      <div class="card">
        <div class="card-title">시스템 점검</div>
        <div id="harness-list"><div class="loading">로딩 중...</div></div>
      </div>
    </div>
  </div>

  <!-- 시장 탭 -->
  <div class="panel" id="panel-market">
    <div class="grid3" id="market-cards">
      <div class="loading">로딩 중...</div>
    </div>
  </div>

  <!-- 신호 탭 -->
  <div class="panel" id="panel-signal">
    <div class="card" id="signal-card">
      <div class="loading">로딩 중...</div>
    </div>
  </div>

  <!-- 이력 탭 -->
  <div class="panel" id="panel-history">
    <div class="card" id="history-card">
      <div class="loading">로딩 중...</div>
    </div>
  </div>

</div>

<script>
const API = 'http://localhost:8888';

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

async function fetchJSON(ep) {
  const r = await fetch(API + ep);
  return r.json();
}

async function loadHarness() {
  try {
    const d = await fetchJSON('/api/harness');
    document.getElementById('grade').textContent = d.grade;
    document.getElementById('score-text').textContent = `${d.score}점 (${d.ok}/${d.total})`;

    const html = d.items.map(i => `
      <div class="check-item">
        <span class="icon">${i.ok ? '✅' : '❌'}</span>
        <span class="name">${i.name}</span>
        <span class="detail">${i.detail}</span>
      </div>`).join('');
    document.getElementById('harness-list').innerHTML = `<div class="check-list">${html}</div>`;
  } catch(e) {
    document.getElementById('harness-list').innerHTML = `<div class="error-msg">오류: ${e.message}</div>`;
  }
}

async function loadAgents() {
  try {
    const d = await fetchJSON('/api/agents');
    const html = d.agents.map(a => `
      <div class="agent-row">
        <span class="dot ${a.ok ? 'ok' : 'wait'}"></span>
        <span class="agent-name">${a.name}</span>
        <span class="agent-status">${a.status}</span>
      </div>`).join('');
    document.getElementById('agents-list').innerHTML = `<div style="border:1px solid var(--border);border-radius:6px">${html}</div><div class="date-label" style="margin-top:8px">기준일: ${d.date}</div>`;
  } catch(e) {
    document.getElementById('agents-list').innerHTML = `<div class="error-msg">오류: ${e.message}</div>`;
  }
}

async function loadMarket() {
  try {
    const d = await fetchJSON('/api/market');
    if (d.error) {
      document.getElementById('market-cards').innerHTML = `<div class="error-msg">${d.error}</div>`;
      return;
    }
    const m = d.data || {};
    const cards = [
      { label: '환율 (USD/KRW)', value: m.usd_krw ? m.usd_krw.toLocaleString() + '원' : 'N/A', sub: '' },
      { label: 'KOSPI', value: m.kospi ? m.kospi.toLocaleString() : 'N/A', sub: m.kospi_change ? `${m.kospi_change > 0 ? '+' : ''}${m.kospi_change}%` : '' },
      { label: 'VIX', value: m.vix ?? 'N/A', sub: m.vix >= 20 ? '공포 구간' : '정상' },
      { label: 'WTI 유가', value: m.wti_oil ? '$' + m.wti_oil : 'N/A', sub: '' },
      { label: 'Fear & Greed', value: m.fear_greed_index ?? 'N/A', sub: m.fear_greed_label ?? '' },
      { label: '기준금리 (KR)', value: m.base_rate_kr ? m.base_rate_kr + '%' : 'N/A', sub: '한국은행' },
    ];
    document.getElementById('market-cards').innerHTML = cards.map(c => `
      <div class="card">
        <div class="card-title">${c.label}</div>
        <div class="card-value">${c.value}</div>
        ${c.sub ? `<div class="card-sub">${c.sub}</div>` : ''}
      </div>`).join('') + `<div class="card-sub" style="grid-column:1/-1">수집일: ${d.date}</div>`;
  } catch(e) {
    document.getElementById('market-cards').innerHTML = `<div class="error-msg">오류: ${e.message}</div>`;
  }
}

async function loadSignal() {
  try {
    const d = await fetchJSON('/api/signal');
    if (d.error) {
      document.getElementById('signal-card').innerHTML = `<div class="error-msg">${d.error}</div>`;
      return;
    }
    const strength = d.strength || 0;
    const pct = Math.min(strength / 10 * 100, 100);
    document.getElementById('signal-card').innerHTML = `
      <div class="signal-topic">${d.topic || '토픽 없음'}</div>
      <div class="strength-bar"><div class="strength-fill" style="width:${pct}%"></div></div>
      <div class="signal-meta" style="margin-top:16px">
        <div class="meta-item"><span class="meta-label">강도</span><span class="meta-val">${strength} / 10</span></div>
        <div class="meta-item"><span class="meta-label">유형</span><span class="meta-val">${d.content_type || 'N/A'}</span></div>
        <div class="meta-item"><span class="meta-label">날짜</span><span class="meta-val">${d.date || 'N/A'}</span></div>
        <div class="meta-item"><span class="meta-label">재발행</span><span class="meta-val">${d.is_republish ? '예' : '아니오'}</span></div>
      </div>
      ${d.level2_chain ? `<div class="card" style="margin-top:16px;background:var(--bg)"><div class="card-title">레벨2 인과관계 체인</div><div style="line-height:1.6">${d.level2_chain}</div></div>` : ''}
      ${d.filters_hit ? `<div style="margin-top:12px;color:var(--muted);font-size:12px">발동 필터: ${Array.isArray(d.filters_hit) ? d.filters_hit.join(', ') : d.filters_hit}</div>` : ''}
    `;
  } catch(e) {
    document.getElementById('signal-card').innerHTML = `<div class="error-msg">오류: ${e.message}</div>`;
  }
}

async function loadHistory() {
  try {
    const d = await fetchJSON('/api/history');
    if (!d.entries || d.entries.length === 0) {
      document.getElementById('history-card').innerHTML = `<div class="error-msg">이력 없음</div>`;
      return;
    }
    const rows = [...d.entries].reverse().map(e => {
      const t = e.content_type || e.type || '';
      const badge = `<span class="type-badge type-${t}">${t}</span>`;
      return `<tr>
        <td>${e.date || ''}</td>
        <td>${e.topic || e.signal || ''}</td>
        <td>${e.strength ?? ''}</td>
        <td>${badge}</td>
      </tr>`;
    }).join('');
    document.getElementById('history-card').innerHTML = `
      <div class="card-title" style="margin-bottom:12px">최근 ${d.entries.length}건 (전체 ${d.count}건)</div>
      <table class="history-table">
        <thead><tr><th>날짜</th><th>토픽</th><th>강도</th><th>유형</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  } catch(e) {
    document.getElementById('history-card').innerHTML = `<div class="error-msg">오류: ${e.message}</div>`;
  }
}

async function loadAll() {
  await Promise.all([loadHarness(), loadAgents(), loadMarket(), loadSignal(), loadHistory()]);
}

loadAll();
</script>
</body>
</html>
