name: HOIN Insight Daily Pipeline

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      start_from:
        description: "시작 Job (collect/intelligence/write/publish)"
        required: false
        default: "collect"
        type: choice
        options: [collect, intelligence, write, publish]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: read

env:
  TZ: Asia/Seoul
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────
  # Job 1: COLLECTOR
  # ─────────────────────────────────────────
  collect:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJson('["collect"]'), inputs.start_from)) ||
      (github.event_name == 'push' && (
        contains(toJson(github.event.commits), 'src/agents/collectors/') ||
        contains(toJson(github.event.commits), 'src/agents/collector') ||
        contains(toJson(github.event.commits), 'src/agents/consensus_collector') ||
        contains(toJson(github.event.commits), 'src/agents/cot_collector') ||
        contains(toJson(github.event.commits), 'dashboard/') ||
        contains(toJson(github.event.commits), '.github/workflows/') ||
        contains(toJson(github.event.commits), 'requirements.txt')
      ))
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Docs Structure
        run: |
          mkdir -p docs/data
          mkdir -p docs/ui
          cp -r dashboard/* docs/ || true
          touch docs/.nojekyll

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Production Sanity Check
        run: |
          python -m src.utils.sanity_check

      - name: Run Collector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python -m src.agents.collectors.collector_runner

      - name: Upload Raw Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw_data
          path: data/raw/
          retention-days: 3

  # ─────────────────────────────────────────
  # Job 2: DETECTOR + ANALYST
  # ─────────────────────────────────────────
  intelligence:
    runs-on: ubuntu-latest
    needs: collect
    if: >
      always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped') && (
        needs.collect.result == 'success' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && contains(fromJson('["intelligence"]'), inputs.start_from)) ||
        (github.event_name == 'push' && (
          contains(toJson(github.event.commits), 'src/agents/detector') ||
          contains(toJson(github.event.commits), 'src/agents/analyst') ||
          contains(toJson(github.event.commits), 'src/agents/collectors/') ||
          contains(toJson(github.event.commits), '.github/workflows/') ||
          contains(toJson(github.event.commits), 'requirements.txt')
        ))
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Raw Data (Current)
        id: dl_raw
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: raw_data
          path: data/raw/

      - name: Download Raw Data (Fallback)
        if: always() && steps.dl_raw.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_RUN=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=raw_data&per_page=1" --jq '.artifacts[0].workflow_run.id')
          rm -rf data/raw && mkdir -p data/raw
          gh run download $LATEST_RUN -n raw_data -D data/raw/ || true

      - name: Run Truth + Detector + Analyst
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src.agents.truth_agent
          python -m src.agents.detector
          python -m src.agents.analyst

      - name: Upload Analysis Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: analysis_data
          path: |
            data/signals/
            data/analysis/
          retention-days: 3

  # ─────────────────────────────────────────
  # Job 3: WRITER + FACT_CHECKER
  # ─────────────────────────────────────────
  write:
    runs-on: ubuntu-latest
    needs: intelligence
    if: >
      always() && (needs.intelligence.result == 'success' || needs.intelligence.result == 'skipped') && (
        needs.intelligence.result == 'success' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && contains(fromJson('["write"]'), inputs.start_from)) ||
        (github.event_name == 'push' && (
          contains(toJson(github.event.commits), 'src/agents/writer') ||
          contains(toJson(github.event.commits), 'src/prompts/writer_prompt') ||
          contains(toJson(github.event.commits), 'src/agents/fact_checker') ||
          contains(toJson(github.event.commits), '.github/workflows/') ||
          contains(toJson(github.event.commits), 'requirements.txt')
        ))
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Raw Data (Current)
        id: dl_raw_w
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: raw_data
          path: data/raw/
      - name: Download Analysis Data (Current)
        id: dl_ana_w
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: analysis_data
          path: data/

      - name: Download Artifacts (Fallback)
        if: always() && (steps.dl_raw_w.outcome == 'failure' || steps.dl_ana_w.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_RUN=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=raw_data&per_page=1" --jq '.artifacts[0].workflow_run.id')
          
          if [ "${{ steps.dl_raw_w.outcome }}" == "failure" ]; then
            rm -rf data/raw && mkdir -p data/raw
            gh run download $LATEST_RUN -n raw_data -D data/raw/ || true
          fi
          
          if [ "${{ steps.dl_ana_w.outcome }}" == "failure" ]; then
            rm -rf data/signals data/analysis && mkdir -p data/signals data/analysis
            gh run download $LATEST_RUN -n analysis_data -D data/ || true
          fi

      - name: Run Writer + FactChecker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.agents.writer
          python -m src.agents.fact_checker

      - name: Upload Script Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: script_data
          path: data/scripts/
          retention-days: 3

  # ─────────────────────────────────────────
  # Job 4: PUBLISHER
  # ─────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: write
    if: >
      always() && (needs.write.result == 'success' || needs.write.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Raw Data (Current)
        id: dl_raw_p
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: raw_data
          path: data/raw/
      - name: Download Analysis Data (Current)
        id: dl_ana_p
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: analysis_data
          path: data/
      - name: Download Script Data (Current)
        id: dl_scr_p
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: script_data
          path: data/scripts/

      - name: Download Artifacts (Fallback)
        if: always() && (steps.dl_raw_p.outcome == 'failure' || steps.dl_ana_p.outcome == 'failure' || steps.dl_scr_p.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_RUN=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=raw_data&per_page=1" --jq '.artifacts[0].workflow_run.id')
          echo "Fetching fallback artifacts from Run ID: $LATEST_RUN"
          
          if [ "${{ steps.dl_raw_p.outcome }}" == "failure" ]; then
            echo "Downloading raw_data fallback..."
            rm -rf data/raw && mkdir -p data/raw
            gh run download $LATEST_RUN -n raw_data -D data/raw/ || true
          fi
          
          if [ "${{ steps.dl_ana_p.outcome }}" == "failure" ]; then
            echo "Downloading analysis_data fallback..."
            rm -rf data/signals data/analysis && mkdir -p data/signals data/analysis
            gh run download $LATEST_RUN -n analysis_data -D data/ || true
          fi
          
          if [ "${{ steps.dl_scr_p.outcome }}" == "failure" ]; then
            echo "Downloading script_data fallback..."
            rm -rf data/scripts && mkdir -p data/scripts
            gh run download $LATEST_RUN -n script_data -D data/scripts/ || true
          fi

      - name: Run Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.agents.publisher

#      - name: Commit Intelligence Outputs
#        run: |
#          git config user.name "hoin-bot"
#          git config user.email "hoin-bot@users.noreply.github.com"
#          
#          # Ensure directories exist
#          mkdir -p docs/data
#          cp -r dashboard/* docs/ || true
#          
#          git fetch origin main
#          git reset --soft origin/main
#          
#          git add docs/ data/ || true
#          
#          if [ -n "$(git status --porcelain docs/ data/)" ]; then
#            git commit -m "chore: save intelligence artifacts and docs [automated] [skip ci]" || true
#            git push origin main
#          else
#            echo "No changes to commit"
#          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

  deploy:
    if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main') && (needs.publish.result == 'success')
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
