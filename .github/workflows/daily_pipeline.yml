name: HOIN Insight Daily Pipeline

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST
  workflow_dispatch:
    inputs:
      start_from:
        description: "시작 Job (collect/intelligence/write/publish)"
        required: false
        default: "collect"
        type: choice
        options: [collect, intelligence, write, publish]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

env:
  TZ: Asia/Seoul
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────
  # Job 1: COLLECTOR
  # ─────────────────────────────────────────
  collect:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJson('["collect"]'), inputs.start_from))
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Docs Structure
        run: |
          mkdir -p docs/data
          mkdir -p docs/ui
          cp -r dashboard/* docs/ || true
          touch docs/.nojekyll

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Production Sanity Check
        run: |
          python -m src.utils.sanity_check

      - name: Run Collector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python -m src.agents.collector_runner

      - name: Upload Raw Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw_data
          path: data/raw/
          retention-days: 3

  # ─────────────────────────────────────────
  # Job 2: DETECTOR + ANALYST
  # ─────────────────────────────────────────
  intelligence:
    runs-on: ubuntu-latest
    needs: collect
    if: >
      always() && (
        needs.collect.result == 'success' ||
        (github.event_name == 'workflow_dispatch' &&
         contains(fromJson('["intelligence","write","publish"]'), inputs.start_from))
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Raw Data
        uses: actions/download-artifact@v4
        with:
          name: raw_data
          path: data/raw/

      - name: Run Detector + Analyst
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src.agents.detector
          python -m src.agents.analyst

      - name: Upload Analysis Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: analysis_data
          path: |
            data/signals/
            data/analysis/
          retention-days: 3

  # ─────────────────────────────────────────
  # Job 3: WRITER + FACT_CHECKER
  # ─────────────────────────────────────────
  write:
    runs-on: ubuntu-latest
    needs: intelligence
    if: >
      always() && (
        needs.intelligence.result == 'success' ||
        (github.event_name == 'workflow_dispatch' &&
         contains(fromJson('["write","publish"]'), inputs.start_from))
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Data
        uses: actions/download-artifact@v4
        with:
          name: raw_data
          path: data/raw/
      - uses: actions/download-artifact@v4
        with:
          name: analysis_data
          path: data/

      - name: Run Writer + FactChecker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.agents.writer
          python -m src.agents.fact_checker

      - name: Upload Script Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: script_data
          path: data/scripts/
          retention-days: 3

  # ─────────────────────────────────────────
  # Job 4: PUBLISHER
  # ─────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: write
    if: >
      always() && (
        needs.write.result == 'success' ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.start_from == 'publish')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Inputs
        uses: actions/download-artifact@v4
        with:
          name: raw_data
          path: data/raw/
      - uses: actions/download-artifact@v4
        with:
          name: analysis_data
          path: data/
      - uses: actions/download-artifact@v4
        with:
          name: script_data
          path: data/scripts/

      - name: Run Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.agents.publisher

      - name: Commit Intelligence Outputs
        run: |
          git config user.name "hoin-bot"
          git config user.email "hoin-bot@users.noreply.github.com"
          
          # Ensure directories exist
          mkdir -p docs/data
          cp -r dashboard/* docs/ || true
          
          git fetch origin main
          git reset --soft origin/main
          
          git add docs/ data/ || true
          
          if [ -n "$(git status --porcelain docs/ data/)" ]; then
            git commit -m "chore: save intelligence artifacts and docs [automated] [skip ci]" || true
            git push origin main
          else
            echo "No changes to commit"
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
