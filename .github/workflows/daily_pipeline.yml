name: daily_pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 21 * * *" # 06:00 KST

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

env:
  TZ: Asia/Seoul

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Docs Structure
        run: |
          mkdir -p docs/data
          mkdir -p docs/ui
          touch docs/.nojekyll

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
                            
      - name: Production Sanity Check
        run: |
          python -m src.utils.sanity_check

      - name: Run Unified Pipeline (v3.0)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "[PIPELINE] Starting HOIN Insight Unified Pipeline..."
          python -m src.pipeline
          echo "[PIPELINE] Completed."

      - name: Commit Intelligence Outputs
        if: success()
        run: |
          git config user.name "hoin-bot"
          git config user.email "hoin-bot@users.noreply.github.com"
          
          # Generated data is in docs/ and data/
          cp -r docs /tmp/docs_bk || true
          cp -r data /tmp/data_bk || true
          
          git fetch origin main
          git reset --hard origin/main
          
          rm -rf docs data
          cp -r /tmp/docs_bk docs || true
          cp -r /tmp/data_bk data || true
          
          git add docs/ data/ || true
          
          if [ -n "$(git status --porcelain docs/ data/)" ]; then
            git commit -m "chore: save intelligence artifacts and docs [automated] [skip ci]" || true
            git push origin main
          else
            echo "No changes to commit"
          fi

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          y=$(TZ='Asia/Seoul' date +"%Y-%m-%d")
          gh issue create --title "Pipeline failed: ${y}" --body "daily_pipeline failed. Check Actions logs."

      - name: Upload Pages Artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
