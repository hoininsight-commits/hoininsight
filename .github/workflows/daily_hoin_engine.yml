# .github/workflows/daily_hoin_engine.yml

name: Daily HOIN Engine

on:
  schedule:
    - cron: '0 21 * * *'   # KST 06:00 = UTC 21:00
  workflow_dispatch:         # 수동 실행 가능

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt

      - name: AGENT-01 COLLECTOR 실행
        run: python -m src.agents.collector
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: AGENT-02 LEARNER 실행
        run: python -m src.agents.learner
        continue-on-error: true   # 유튜브 크롤링 실패해도 계속

      - name: AGENT-03 DETECTOR 실행
        run: python -m src.agents.detector

      # AGENT-04, 05는 API 키 설정 후 활성화
      # - name: AGENT-04 ANALYST 실행
      #   run: python -m src.agents.analyst
      #   env:
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # - name: AGENT-05 WRITER 실행
      #   run: python -m src.agents.writer
      #   env:
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: AGENT-06 PUBLISHER 실행
        run: python -m src.agents.publisher

      - name: 결과 커밋 및 푸시
        run: |
          git config --global user.email "hoin-bot@github.com"
          git config --global user.name "HOIN Bot"
          git add data/ dashboard/
          git commit -m "🤖 Daily HOIN Engine $(date '+%Y-%m-%d')" || exit 0
          git push
