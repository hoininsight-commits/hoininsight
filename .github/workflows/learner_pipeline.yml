name: learner_pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Seoul

jobs:
  run-learner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup YouTube Cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > youtube_cookies.txt
            echo "✅ YouTube cookies restored"
          else
            echo "⚠️ YouTube cookies secret is missing"
          fi

      - name: Run Learner Agent
        run: |
          python3 src/agents/learner_agent.py

      - name: Commit Learning Outputs
        if: success()
        run: |
          git config user.name "hoin-bot"
          git config user.email "hoin-bot@users.noreply.github.com"
          git add data/learning/
          if [ -n "$(git status --porcelain data/learning/)" ]; then
            git commit -m "chore: save collector learning artifacts [automated] [skip ci]"
            git push origin main
          else
            echo "No learning changes to commit"
          fi
