name: YouTube Learner (Script Delivery)

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"  # KST 11:00, 17:00, 23:00, 05:00
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup YouTube Cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > youtube_cookies.txt
            echo "✅ YouTube cookies restored"
          else
            echo "⚠️ YouTube cookies secret is missing"
          fi

      - name: Run YouTube Learner (Auto Round)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/auto_learner.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p data/transcripts/youtube data/raw/youtube
          git add -f data/transcripts/youtube data/raw/youtube
          git commit -m "Auto: Collected new YouTube transcripts" || echo "No changes to commit"
          git push
